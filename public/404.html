<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var base = "/pirografoschilenos/";
        var path = window.location.pathname;
        var route =
          path.indexOf(base) === 0 ? path.slice(base.length - 1) : path;
        window.location.replace(base + "?p=" + encodeURIComponent(route));
      })();
    </script>
  </head>
  <body></body>
</html>
